# Mỗi lần push lên main: test -> build -> đẩy ghcr.io/<owner>/<repo> (genealogy-be) với hai tag: latest và sha-<7 ký tự>.
# Test phải xanh mới được publish: main hỏng không được phép thành `latest`.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false    # không bao giờ huỷ job đang publish giữa chừng

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Cùng cấu hình với service db-test trong docker-compose.yml (tests/conftest.py mặc định nối 127.0.0.1:55432/genealogy_test).
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genealogy_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d genealogy_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen        # gồm nhóm dev (pytest...); python 3.12 theo requires-python
      - run: uv run pytest -q

  image:
    needs: [test]
    runs-on: ubuntu-latest      # amd64, khớp server
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}     # tự viết thường
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}      # gắn package với repo
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Tóm tắt
        run: |
          {
            echo "### Image đã đẩy"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Triển khai: trên server chạy \`./update.sh\` (hoặc \`API_IMAGE_TAG=sha-${GITHUB_SHA::7} ./update.sh\` cho đúng bản build này)."
          } >> "$GITHUB_STEP_SUMMARY"
