# Compose riêng cho backend — để phát triển và chạy test, không phải bản deploy
# (bản deploy nằm ở ../docker-compose.yml).
#
# Cách dùng thường gặp:
#   docker compose up -d --wait db-test   # Postgres dùng cho `uv run pytest`
#   docker compose up -d --wait db        # Postgres dev (chạy `uv run uvicorn ...` ngoài Docker)
#   docker compose up --build api         # chạy luôn API trong Docker (kéo theo db)
#
# Mọi port đều chỉ bind 127.0.0.1 và KHÔNG dùng 5432 (hay bị Postgres cài sẵn
# trên máy chiếm); đổi bằng DB_PORT / TEST_DB_PORT / API_PORT nếu trùng.
#
# Test chạy trên Postgres thật (cùng major version với bản deploy), không dùng
# SQLite nữa — xem tests/conftest.py.

name: genealogy-api

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # Postgres cho dev. Dữ liệu giữ trong volume postgres_data.
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: genealogy
    volumes:
      # postgres:18+ mount ở /var/lib/postgresql (không phải .../data như bản
      # 16) — image tự tạo thư mục con theo major version. Mount sai chỗ sẽ
      # crash-loop ngay lúc khởi động.
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  # Postgres CHỈ để chạy test: dữ liệu nằm trên tmpfs (mất khi container dừng),
  # tắt fsync cho nhanh. Tên database phải kết thúc bằng "_test" — conftest từ
  # chối chạy trên database khác để không bao giờ xoá nhầm dữ liệu thật.
  # Có profile "test" nên `docker compose up` thường không bật nó; gọi thẳng
  # tên service (`up -d --wait db-test`) thì tự được bật.
  db-test:
    profiles: ["test"]
    image: postgres:18.6
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: genealogy_test
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    logging: *default-logging

  # API trong Docker (build từ ./Dockerfile; CMD tự chạy `alembic upgrade head`).
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/genealogy
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_EXPIRE_MINUTES: 60
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

volumes:
  postgres_data:
  uploads_data:
